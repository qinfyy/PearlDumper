[package]
name = "castorice-dumper"
version = "0.1.0"
edition = "2024"

[lib]
name = "astrolabe"
crate-type = [ "cdylib" ]

[workspace]
resolver = "3"
members = ["crates/derive", "crates/utils", "crates/il2cpp", "crates/reflection", "crates/dumper"]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.102"
ansi_term = "0.12.1"
base64 = "0.22.1"
bitflags = "2.13.0"
byteorder = "1.5.0"
convert_case = "0.11.0"
env_logger = "0.11.10"
iced-x86 = "1.21.0"
ilhook = "2.3.0"
indexmap = { version = "2.14.0", features = ["serde"] }
inventory = "0.3.24"
log = "0.4.28"
microseh = "1.2.0"
paste = "1.0.15"
patternscan = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
tracing = { version = "0.1.44", features = ["log"] }
ureq = { version = "3.3.0", features = ["rustls"] }
syn = { version = "2.0.100", features = ["full"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Console",
    "Win32_Security", "Win32_System_Threading", "Win32_System_ProcessStatus",
    "Win32_System_SystemServices", "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem",
] }
il2cpp = { path = "crates/il2cpp" }
reflection = { path = "crates/reflection" }
utils = { path = "crates/utils" }
dahlah-derive = { path = "crates/derive" }

[dependencies]
anyhow.workspace = true
ansi_term.workspace = true
env_logger.workspace = true
il2cpp.workspace = true
log.workspace = true
microseh.workspace = true
tracing.workspace = true
windows.workspace = true
dumper = { path = "crates/dumper" }

[features]
default = []
gateway-network = ["dumper/gateway-network"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
