[package]
name = "castorice-dumper"
version = "0.1.0"
edition = "2024"

[lib]
name = "astrolabe"
crate-type = [ "cdylib" ]

[dependencies]
ctor = "0.4.2"
pelite = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
thiserror = "2.0.12"
microseh = "1.1"
anyhow = "1.0.98"
paste = "1.0.15"
regex = "1.11.1"
indicatif = "0.17.11"
figlet-rs = "0.1.5"
colored = "3.0.0"
once_cell = "1.21.3"

[dependencies.windows]
version = "0.61.1"
features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_Security", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32", "Win32_Storage", "Win32_Storage_FileSystem"]
